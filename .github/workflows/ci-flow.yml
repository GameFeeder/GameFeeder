name: ci-flow

on:
  pull_request:
  # Also run it on pushes for main, for the badges
  push:
    branches:
      - main

# Add permissions block to limit GITHUB_TOKEN permissions
permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v7.0.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Create CI config
        run: |
          mkdir -p config
          echo '{"environment":"ci","bots":{},"reddit":{},"rollbar":{"enabled":false,"accessToken":"mock"}}' > config/api_config.json

      - name: Install dependencies
        run: npm ci

      - name: Check for code style & formatting
        run: npm run biome:check

      - name: Run typescript compiler
        run: npm run build

      - name: Check for circular dependencies
        run: npx madge --circular --extensions js ./dist

      - name: Run the tests
        run: npm run test

        env:
          CI: true
