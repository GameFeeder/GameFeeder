name: release-flow

on:
  release:
    types: [published]

# Add permissions block to limit GITHUB_TOKEN permissions
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      IMAGE: ghcr.io/gamefeeder/gamefeeder/gamefeeder
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Determine release version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and tag the Docker image
        run: docker build .
          --target production
          --build-arg VERSION=${{ steps.version.outputs.version }}
          --tag "${IMAGE}:${{ steps.version.outputs.version }}"
          --tag "${IMAGE}:latest"
      - name: Login to the GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Publish the Docker image:version
        run: docker push "${IMAGE}:${{ steps.version.outputs.version }}"
      - name: Publish the Docker image:latest
        run: docker push "${IMAGE}:latest"
